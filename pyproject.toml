[tool.poetry]
name = "predictive-coding"
version = "0.1.0"
description = "Predictive coding MNIST demo — continual learning web app"
authors = []
packages = [{include = "application"}]

[tool.poetry.dependencies]
python = ">=3.11,<3.13"
# torch/torchvision fetched from the PyTorch CUDA index (see source below)
torch = {version = ">=2.3.0", source = "pytorch-cu126"}
torchvision = {version = ">=0.18.0", source = "pytorch-cu126"}
numpy = ">=1.26.0"
matplotlib = ">=3.9.0"
solara = ">=1.40.0"
plotly = ">=5.22.0"
anywidget = ">=0.9.0"
safetensors = ">=0.4.0"

# Supplemental index for CUDA-enabled PyTorch wheels
[[tool.poetry.source]]
name = "pytorch-cu126"
url = "https://download.pytorch.org/whl/cu126"
priority = "supplemental"

[build-system]
requires = ["poetry-core>=1.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.setuptools.packages.find]
where = ["."]
include = ["application*"]
